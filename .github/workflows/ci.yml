name: CI

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: Qualidade e build
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Tipos
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Fronteiras de arquitetura
        run: npm run arch

      - name: Validar conteúdo publicado
        run: npm run content:validate-published

      - name: Testes unitários
        run: npm run test

      - name: Build de produção
        run: npm run build
        env:
          AUTH_SECRET: ci-build-secret-not-used-in-production
          AUTH_TRUST_HOST: "true"
          NEXT_TELEMETRY_DISABLED: "1"