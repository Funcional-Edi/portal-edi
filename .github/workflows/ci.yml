name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Tipos
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Fronteiras de arquitetura
        run: npm run arch

      - name: Testes
        run: npm run test

      - name: Build
        run: npm run build
        env:
          AUTH_SECRET: ci-not-a-real-secret
